{% extends "base.html" %}

{% block content %}
  <article>
    <h1>{% if object %}Edit {{ object.title }}{% else %}New vacancy{% endif %}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Save</button>
      <a href="{% url 'tracker:vacancy_list' %}">Cancel</a>
    </form>
  </article>
{% endblock %}
