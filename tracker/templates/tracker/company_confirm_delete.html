{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <article>
    <h1>{% blocktranslate trimmed with name=object.name %}Delete {{ name }}?{% endblocktranslate %}</h1>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="secondary">{% translate "Yes, delete" %}</button>
      <a href="{% url 'tracker:company_list' %}">{% translate "Cancel" %}</a>
    </form>
  </article>
{% endblock %}
