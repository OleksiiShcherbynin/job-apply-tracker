{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Log in" %} · Job Apply Tracker{% endblock %}

{% block content %}
  <article>
    <h1>{% translate "Log in" %}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">{% translate "Log in" %}</button>
    </form>
  </article>
{% endblock %}
