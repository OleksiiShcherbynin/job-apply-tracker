services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      # Throwaway local password; never reused for a public deployment.
      POSTGRES_PASSWORD: devpass
    ports:
      # Host port 5433: the dev machine runs its own PostgreSQL service on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      POSTGRES_DB: tracker
    ports:
      # Only this laptop can open it.
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      jobnet:
        aliases:
          # job-ai-assist reaches the API at http://job-apply-tracker:8000
          - job-apply-tracker
    restart: unless-stopped

volumes:
  pgdata:
  media:

networks:
  jobnet:
    # Fixed name declared by both projects (not external): whichever starts
    # first creates it, and neither fails when the other is absent.
    name: job-net
