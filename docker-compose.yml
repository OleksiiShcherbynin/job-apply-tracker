services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      # Throwaway dev-only password; prod credentials come from the environment.
      POSTGRES_PASSWORD: devpass
    ports:
      # Host port 5433: the dev machine runs its own PostgreSQL service on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
